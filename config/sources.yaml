# Catálogo de fuentes y parámetros de la corrida.
#
# Sobre los tiers, que son lo que decide el orden de prioridad:
#   tier 1 = publica eventos como su razón de ser (ticketeras, sedes, páginas
#            de agenda). Es lo que de verdad alimenta la app.
#   tier 2 = publica eventos seguido pero mezclados con otra cosa (municipios,
#            casas de cultura, universidades).
#   tier 3 = publica un evento entre veinte noticias (medios generales).
#
# El catálogo de Facebook es a propósito más grande de lo que entra en una sola
# corrida. El planificador atiende las más prioritarias en cada ola y va rotando;
# como un evento se anuncia con días de anticipación, ver una fuente cada tres
# horas en vez de cada hora no pierde nada. Ver docs/ESTRATEGIA_FACEBOOK.md.

settings:
  timezone: America/La_Paz

  # --- Anti-bloqueo de Facebook -------------------------------------------
  # El número que importa. Medido en corridas reales: Facebook deja pasar ~2
  # páginas por IP. Subirlo no consigue más datos, solo quema la IP más rápido.
  facebook_paginas_por_ip: 2
  facebook_pausa_segundos: 9
  facebook_pausa_tras_bloqueo: 35
  facebook_espera_segundos: 2.5
  facebook_scrolls: 3

  # El enriquecimiento abre el post completo. En este proyecto no es opcional:
  # el feed recorta los afiches con "Ver más" y justo ahí están la fecha, el
  # lugar y el precio. Cada visita gasta presupuesto de la IP, así que el
  # scraper elige con cuentagotas a cuáles se lo gasta.
  facebook_enriquecer: true
  facebook_enriquecer_limite: 4
  facebook_enriquecer_timeout_ms: 12000

  # --- Fuentes web ---------------------------------------------------------
  web_concurrencia: 5
  web_max_enlaces: 12
  request_timeout_seconds: 20
  user_agent: EventosBoliviaBot/1.0 (+agenda-publica-de-eventos; crawler respetuoso)

  # --- Clasificación y catálogo -------------------------------------------
  max_items_por_fuente: 20
  max_muestras_rechazadas: 3
  umbral_fusion: 0.30
  umbral_historial: 0.62
  # Cuántos días se conserva un evento ya pasado, para que la app pueda mostrar
  # "esta semana" incluyendo lo de anteayer.
  conservar_pasados_dias: 4
  incluir_finalizados: true

